name: AQE1091 skipped gates continuation with inherited lint evidence
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      CI: 'true'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: rudycelekli/agentic-qe
        ref: c889e37bc3645b3b39fcbf620c0921c61295b0ef
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.13.0
    - name: Freeze exact original source and evaluator
      run: 'python - <<''PREP''

        import base64,hashlib,json,subprocess

        from pathlib import Path

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD'']).decode().strip()==''c889e37bc3645b3b39fcbf620c0921c61295b0ef''

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD^{tree}'']).decode().strip()==''85dcf8b3fb277d57cdd0be30479a5792bfd52324''

        files=subprocess.check_output([''git'',''ls-files'',''-z'']).decode().split(''\0'')[:-1]

        identity={f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files if Path(f).is_file()}

        Path(''/tmp/base-identity.json'').write_text(json.dumps(identity,sort_keys=True))

        Path(''/tmp/original-test.ts'').write_bytes(Path(''tests/integration/learning/recommended-strategy-namespace.test.ts'').read_bytes())

        Path(''/tmp/baseline-test.ts'').write_bytes(base64.b64decode(''''))

        Path(''/tmp/evaluate-baseline.py'').write_bytes(base64.b64decode(''''))

        assert hashlib.sha256(Path(''/tmp/baseline-test.ts'').read_bytes()).hexdigest()==''0eb03608f1825d99284dd9414fd15dbc2a15fb48c6bf9917c7bf23181d9d4b5d''

        PREP

        mkdir -p "$RUNNER_TEMP/home"

        echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

        python /tmp/evaluate-baseline.py'
    - name: Locked upstream dependencies
      run: npm ci
    - name: Document original source ESLint diagnostics before patch
      run: 'set +e

        npx eslint src/domains/learning-optimization/{interfaces.ts,services/metrics-optimizer.ts} src/mcp/tools/learning-optimization/optimize.ts --format json > /tmp/eslint-original.json

        result=$?

        set -e

        test "$result" -eq 1'
    - name: Apply exact private candidate after proved native red
      run: 'python - <<''PATCH''

        import base64,hashlib,json,subprocess

        from pathlib import Path

        identity=json.loads(Path(''/tmp/base-identity.json'').read_text())

        assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h for f,h in identity.items())

        patch=base64.b64decode('''')

        assert hashlib.sha256(patch).hexdigest()==''0882d063422a0966a68d6328e320d8f804a71f23f105a83c385f062a3fe2a27f''

        Path(''/tmp/candidate.patch'').write_bytes(patch)

        subprocess.run([''git'',''apply'',''--index'',''/tmp/candidate.patch''],check=True)

        assert subprocess.check_output([''git'',''write-tree'']).decode().strip()==''099d8f3f8deb36d80dddb5b1796792d260122cae''

        Path(''/tmp/candidate-identity.json'').write_text(json.dumps({''src/domains/learning-optimization/interfaces.ts'': ''c292690bad57a7a29902274e77ffc43818e913d7cd19b7e02c449b8ec32597f9'', ''src/domains/learning-optimization/services/metrics-optimizer.ts'': ''6abbfbfd86abe7a98509cb29bcba9e479d46ece8ca617ab385769d8247fc19c5'', ''src/mcp/tools/learning-optimization/optimize.ts'': ''73f18ddf65828ad7f264579ad8d63ddcd1baab256cfde832054ca130ce035221'', ''tests/integration/learning/recommended-strategy-namespace.test.ts'': ''69bde9eab697064b1eabaeb4f8d7d47a36d2aa1408254d6a7a2e0f384d46baab''},sort_keys=True))

        Path(''/tmp/stdio-proof.mjs'').write_bytes(base64.b64decode(''''))

        PATCH'
    - name: Verify no added lint diagnostics and build actual runtime only
      run: "set +e\nnpx eslint src/domains/learning-optimization/{interfaces.ts,services/metrics-optimizer.ts} src/mcp/tools/learning-optimization/optimize.ts --format json > /tmp/eslint-candidate.json\nresult=$?\nset -e\ntest \"$result\" -eq 1\npython - <<'LINT'\nimport json\nfrom pathlib import Path\ndef diagnostics(name):\n rows=json.loads(Path(name).read_text());out=[]\n for r in rows:\n  for m in r['messages']:out.append((r['filePath'].split('/src/')[-1],m['ruleId'],m['severity'],m['message']))\n return out\na=diagnostics('/tmp/eslint-original.json');b=diagnostics('/tmp/eslint-candidate.json')\nassert a==b and len(a)==1 and a[0][0]=='mcp/tools/learning-optimization/optimize.ts' and a[0][1]=='unused-imports/no-unused-vars' and \"'totalRelevance'\" in a[0][3]\nPath('/tmp/eslint-inherited-only.json').write_text(json.dumps({'original':a,'candidate':b,'added':0,'lint_status':'inherited failure; not green'}))\nLINT\nnpx tsc > /tmp/runtime-tsc.log 2>&1\nnpm run build:esm > /tmp/runtime-esm.log 2>&1\nnpm run build:mcp > /tmp/runtime-mcp.log 2>&1"
    - name: Full applicable learning suites
      run: 'npx vitest run tests/unit/domains/learning-optimization tests/unit/mcp/tools/learning-optimize-sona.test.ts tests/integration/learning --reporter=junit --outputFile=/tmp/learning.xml > /tmp/learning.log 2>&1

        cat /tmp/learning.log

        python - <<''SUITES''

        import xml.etree.ElementTree as E,json

        from pathlib import Path

        r=E.parse(''/tmp/learning.xml'').getroot();assert not r.findall(''.//failure'') and not r.findall(''.//error'')

        Path(''/tmp/learning-counts.json'').write_text(json.dumps({''cases'':len(r.findall(''.//testcase'')),''skipped'':len(r.findall(''.//skipped'')),''failures'':0,''errors'':0}))

        assert len(r.findall(''.//testcase''))>=700

        SUITES'
    - name: Actual built MCP stdio boundary objective parity
      run: 'node /tmp/stdio-proof.mjs > /tmp/stdio.log 2>&1

        cat /tmp/stdio.log'
    - name: Final exact source byte and tree guards
      if: always()
      run: 'git diff --exit-code

        test "$(git diff --cached --binary --full-index | sha256sum | cut -d'' '' -f1)" = 0882d063422a0966a68d6328e320d8f804a71f23f105a83c385f062a3fe2a27f

        test "$(git write-tree)" = 099d8f3f8deb36d80dddb5b1796792d260122cae

        python - <<''GUARD''

        import hashlib,json

        from pathlib import Path

        expected=json.loads(Path(''/tmp/base-identity.json'').read_text());expected.update(json.loads(Path(''/tmp/candidate-identity.json'').read_text()))

        assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h for f,h in expected.items())

        GUARD'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: aqe1091-typed-objective-qualification
        path: '/tmp/base-identity.json

          /tmp/candidate.patch

          /tmp/candidate-identity.json

          /tmp/focused.xml

          /tmp/focused.log

          /tmp/build.log

          /tmp/typecheck.log

          /tmp/eslint.log

          /tmp/learning.xml

          /tmp/learning.log

          /tmp/learning-counts.json

          /tmp/stdio-proof.mjs

          /tmp/stdio.log

          /tmp/aqe1091-stdio-results.json

          /tmp/aqe1091-stdio-partial.json

          /tmp/aqe1091-stdio-stderr.log

          /tmp/aqe1091-stdio-cleanup.json

          /tmp/eslint-original.json

          /tmp/eslint-candidate.json

          /tmp/eslint-inherited-only.json

          /tmp/runtime-tsc.log

          /tmp/runtime-esm.log

          /tmp/runtime-mcp.log'
        if-no-files-found: error
