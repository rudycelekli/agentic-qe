name: AQE1091 objective isolation native baseline
'on': workflow_dispatch
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      CI: 'true'
      AQE1091_RECEIPT: /tmp/aqe1091-native-results.jsonl
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: rudycelekli/agentic-qe
        ref: c889e37bc3645b3b39fcbf620c0921c61295b0ef
        persist-credentials: false
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 24.13.0
    - name: Freeze exact original source and evaluator
      run: 'python - <<''PREP''

        import base64,hashlib,json,subprocess

        from pathlib import Path

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD'']).decode().strip()==''c889e37bc3645b3b39fcbf620c0921c61295b0ef''

        assert subprocess.check_output([''git'',''rev-parse'',''HEAD^{tree}'']).decode().strip()==''85dcf8b3fb277d57cdd0be30479a5792bfd52324''

        files=subprocess.check_output([''git'',''ls-files'',''-z'']).decode().split(''\0'')[:-1]

        identity={f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files if Path(f).is_file()}

        Path(''/tmp/base-identity.json'').write_text(json.dumps(identity,sort_keys=True))

        Path(''/tmp/original-test.ts'').write_bytes(Path(''tests/integration/learning/recommended-strategy-namespace.test.ts'').read_bytes())

        Path(''/tmp/baseline-test.ts'').write_bytes(base64.b64decode(''''))

        Path(''/tmp/evaluate-baseline.py'').write_bytes(base64.b64decode(''''))

        assert hashlib.sha256(Path(''/tmp/baseline-test.ts'').read_bytes()).hexdigest()==''0eb03608f1825d99284dd9414fd15dbc2a15fb48c6bf9917c7bf23181d9d4b5d''

        PREP

        mkdir -p "$RUNNER_TEMP/home"

        echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"

        python /tmp/evaluate-baseline.py'
    - name: Locked upstream dependencies
      run: npm ci
    - name: Actual SQLite and memory native baseline only
      run: "cp /tmp/baseline-test.ts tests/integration/learning/recommended-strategy-namespace.test.ts\nset +e\nnpx vitest run tests/integration/learning/recommended-strategy-namespace.test.ts --reporter=junit --outputFile=/tmp/before.xml > /tmp/before.log 2>&1\nresult=$?\nset -e\ncat /tmp/before.log\ncp /tmp/original-test.ts tests/integration/learning/recommended-strategy-namespace.test.ts\ntest \"$result\" -ne 0\npython /tmp/evaluate-baseline.py /tmp/before.xml\npython - <<'RECEIPT'\nimport json\nfrom pathlib import Path\nrows=[json.loads(line) for line in Path('/tmp/aqe1091-native-results.jsonl').read_text().splitlines()]\nassert len(rows)==8\nassert {(r['backendType'],r['path'],r['requested'].get('metric',r['requested'].get('objective',{}).get('metric'))) for r in rows}=={(b,p,m) for b in ['sqlite','memory'] for p in ['service','MCP'] for m in ['coverage','latency']}\nfor r in rows:\n assert r['storedObjective']['metric']=='coverage' and r['storedObjective']['direction']=='maximize'\n assert r['result']['success'] is True\n actual=r['result']['value'] if r['path']=='service' else r['result']['data']['optimizeResult']['bestStrategy']\n assert actual['name']==r['storedStrategy']['name'] and actual['expectedOutcome']==r['storedStrategy']['expectedOutcome']\nRECEIPT"
    - name: Original production and test bytes unchanged
      if: always()
      run: 'git diff --exit-code

        git diff --cached --exit-code

        python - <<''GUARD''

        import hashlib,json

        from pathlib import Path

        identity=json.loads(Path(''/tmp/base-identity.json'').read_text())

        assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h for f,h in identity.items())

        GUARD'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: aqe1091-objective-native-baseline
        path: '/tmp/base-identity.json

          /tmp/baseline-test.ts

          /tmp/evaluate-baseline.py

          /tmp/before.log

          /tmp/before.xml

          /tmp/aqe1091-native-results.jsonl'
        if-no-files-found: error
