name: AQE1087 JSON clear convergence qualification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.0', '24.13.0']
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rudycelekli/agentic-qe
          ref: af8e1b40c435df809963e3fc458a0f7200907048
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - name: Preserve exact source and test inputs
        run: |
          python - <<'PREP'
          import base64,hashlib,json,subprocess
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()=='af8e1b40c435df809963e3fc458a0f7200907048'
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip()=='e14e0f2b7fec528af94dc6b133568941d79f42b2'
          files=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')[:-1]
          identity={f:hashlib.sha256(Path(f).read_bytes()).hexdigest() for f in files if Path(f).is_file()}
          Path('/tmp/base-identity.json').write_text(json.dumps(identity,sort_keys=True))
          Path('/tmp/original-test.ts').write_bytes(Path('tests/unit/memory/crdt-store-invalid-register.test.ts').read_bytes())
          Path('/tmp/candidate.patch').write_bytes(base64.b64decode(''))
          assert hashlib.sha256(Path('/tmp/candidate.patch').read_bytes()).hexdigest()=='60ad2565b28e8bee3c9806890a9f37932b0b8e5e241782cad8cd9a269e1679f0'
          Path('/tmp/candidate-test.ts').write_bytes(base64.b64decode(''))
          Path('/tmp/evaluate-baseline.py').write_bytes(base64.b64decode(''))
          PREP
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          python /tmp/evaluate-baseline.py
      - name: Locked upstream dependencies
        run: npm ci
      - name: Require real JSON regression on original source
        run: |
          cp /tmp/candidate-test.ts tests/unit/memory/crdt-store-invalid-register.test.ts
          set +e
          npx vitest run tests/unit/memory/crdt-store-invalid-register.test.ts --reporter=junit --outputFile=/tmp/before.xml > /tmp/before.log 2>&1
          result=$?
          set -e
          cat /tmp/before.log
          cp /tmp/original-test.ts tests/unit/memory/crdt-store-invalid-register.test.ts
          test "$result" -ne 0
          python /tmp/evaluate-baseline.py /tmp/before.xml
      - name: Apply exact frozen source candidate
        run: |
          python - <<'GUARD'
          import hashlib,json
          from pathlib import Path
          expected=json.loads(Path('/tmp/base-identity.json').read_text())
          assert all(Path(f).is_file() and hashlib.sha256(Path(f).read_bytes()).hexdigest()==h for f,h in expected.items())
          GUARD
          git diff --exit-code
          git apply --index /tmp/candidate.patch
          git diff --check --cached
          test "$(git diff --cached --binary --full-index | sha256sum | cut -d' ' -f1)" = 60ad2565b28e8bee3c9806890a9f37932b0b8e5e241782cad8cd9a269e1679f0
          test "$(git write-tree)" = 39e8df1320d04b8c300e8121abff5b74c20d20dd
          python - <<'GUARD'
          import hashlib,json
          from pathlib import Path
          expected={'src/memory/crdt/crdt-store.ts': '459b55f8e6a84e1f26269ed4362847704b7ca9c7ecb87eab97d1bcc8a39c8863', 'tests/unit/memory/crdt-store-invalid-register.test.ts': 'd7fd4b19051e63f789650cbfdd32cf54e0051ccf7a1cde88e71d2a2aaccc5850'}
          assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h for f,h in expected.items())
          Path('/tmp/candidate-identity.json').write_text(json.dumps(expected,sort_keys=True))
          GUARD
      - name: Required build and type checks
        run: |
          npm run build > /tmp/build.log 2>&1
          tail -25 /tmp/build.log
          npm run typecheck > /tmp/typecheck.log 2>&1
          cat /tmp/typecheck.log
          npx eslint src/memory/crdt/crdt-store.ts > /tmp/eslint.log 2>&1
          cat /tmp/eslint.log
      - name: Full applicable CRDT and replication controls
        run: |
          npx vitest run             tests/unit/memory/crdt.test.ts             tests/unit/memory/crdt-delta-history.test.ts             tests/unit/memory/crdt-store-invalid-register.test.ts             tests/unit/memory/lww-register.test.ts             tests/unit/memory/lww-register-order.test.ts             tests/unit/memory/lww-register-finite-timestamp.test.ts             tests/unit/memory/g-counter.test.ts             tests/unit/memory/pn-counter.test.ts             tests/unit/memory/or-set.test.ts             tests/unit/memory/or-set-restored-tags.test.ts             tests/unit/memory/convergence-fingerprint.test.ts             tests/unit/memory/convergence-tracker.test.ts             tests/unit/shared/prototype-key-buckets.test.ts             tests/integration/protocols/full-flow.test.ts             --reporter=junit --outputFile=/tmp/after.xml > /tmp/after.log 2>&1
          cat /tmp/after.log
          python - <<'RESULT'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/after.xml').getroot()
          cases=root.findall('.//testcase')
          assert len(cases)>=344 and not root.findall('.//error') and not root.findall('.//failure') and not root.findall('.//skipped')
          print('All',len(cases),'applicable native cases passed')
          RESULT
      - name: Final unchanged exact source guards
        if: always()
        run: |
          git diff --exit-code
          test "$(git diff --cached --binary --full-index | sha256sum | cut -d' ' -f1)" = 60ad2565b28e8bee3c9806890a9f37932b0b8e5e241782cad8cd9a269e1679f0
          test "$(git write-tree)" = 39e8df1320d04b8c300e8121abff5b74c20d20dd
          python - <<'GUARD'
          import hashlib,json
          from pathlib import Path
          expected=json.loads(Path('/tmp/candidate-identity.json').read_text())
          assert all(hashlib.sha256(Path(f).read_bytes()).hexdigest()==h for f,h in expected.items())
          GUARD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aqe1087-native-${{ matrix.node }}
          path: |
            /tmp/base-identity.json
            /tmp/candidate.patch
            /tmp/candidate-identity.json
            /tmp/evaluate-baseline.py
            /tmp/before.xml
            /tmp/before.log
            /tmp/after.xml
            /tmp/after.log
            /tmp/build.log
            /tmp/typecheck.log
            /tmp/eslint.log
          if-no-files-found: error
